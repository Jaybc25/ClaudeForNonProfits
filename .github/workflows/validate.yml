name: Validate nonprofit planner
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/catalog.test.cjs
      - run: |
          for file in *.js; do node --check "$file"; done
